name: Build aimrealtime image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: 0.1.0)'
        required: false
        default: '0.1.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || '0.1.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Point Docker at the dind sidecar
        # The job runs in its own bridge network; the runner pod's dind is the
        # network's gateway. 127.0.0.1 only works inside the runner pod itself.
        run: |
          GW_HEX=$(awk '$2=="00000000" {print $3; exit}' /proc/net/route)
          GW=$(printf '%d.%d.%d.%d' 0x${GW_HEX:6:2} 0x${GW_HEX:4:2} 0x${GW_HEX:2:2} 0x${GW_HEX:0:2})
          echo "gateway=${GW}" >&2
          echo "DOCKER_HOST=tcp://${GW}:2375" >> "$GITHUB_ENV"
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: bayerhazard
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/bayerhazard/aimrealtime:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "**ghcr.io/bayerhazard/aimrealtime:${{ env.TAG }}**" >> "$GITHUB_STEP_SUMMARY"

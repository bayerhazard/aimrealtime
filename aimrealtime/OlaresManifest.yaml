---
olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimrealtime: 1

metadata:
  name: aimrealtime
  appid: aimrealtime
  icon: https://raw.githubusercontent.com/bayerhazard/aimrealtime/main/icon.png
  description: Realtime voice endpoint for Open WebUI 0.12 calls — drives this Olares' Router models (STT, chat, TTS) over their OpenAI-compatible APIs, CPU only, zero configuration
  title: AIM Realtime Voice
  version: '26.10.17'
  categories:
    - Audio
    - Applications

# Shared API stub for the Olares Router: the platform turns this into a
# shared gateway route; llm-init (:8090) answers the Model Console contract
# the Router reads the model card from.
sharedEntrances:
  - name: aimrealtime
    host: sharedentrances-api
    port: 0
    title: AIM Realtime Voice
    invisible: true
    authLevel: internal
    icon: https://raw.githubusercontent.com/bayerhazard/aimrealtime/main/icon.png

entrances:
  - name: aimrealtime
    port: 8090
    host: download-svc
    title: AIM Realtime Voice
    icon: https://raw.githubusercontent.com/bayerhazard/aimrealtime/main/icon.png
    authLevel: internal
    invisible: true

spec:
  versionName: '26.10.17'
  onlyAdmin: true
  upgradeDescription: |
    v26.10.17: Status announcements (working / approval / deferred) are spoken
    as their message again instead of a bare "Okay." when they arrive with a
    metadata.status (image 0.6.5).
    v26.10.16: Hardening for Open WebUI 0.12 voice calls, and /healthz reports the running version (image 0.6.4). Open
    WebUI ends a call on any provider error event, so a transient speech
    recognition or synthesis failure now stays silent instead of erroring, and
    a tool call naming a function Open WebUI never declared (models with a
    built-in toolset can name their own) is dropped before it can abort the
    call. Spoken transcripts are emitted before synthesis, so the caller still
    sees the words when the voice backend hiccups.
    v26.10.13: A client-specified transcription model (Open WebUI sends one) is
    ignored while the app runs on this machine's Router, which answers to its
    own categories; it stays honoured with a fixed upstream URL (image 0.6.2).
    v26.10.12: Fixes the /healthz crash that left the pod unready after the
    26.10.11 Router auto-discovery (image 0.6.1).
    v26.10.11: Installs on any Olares without a single environment value. The
    upstreams are resolved through this machine's Router (default-stt /
    default-chat / default-tts), so no app routes or model names are needed;
    explicit UPSTREAM_*_URL overrides still work and are dropped automatically
    when they do not answer here. The Router endpoint and this machine's base
    domain are discovered on their own. MODEL_* are no longer required fields,
    API_KEY is optional (empty = no bearer, the Olares edge already gates the
    entrance), and the image moved to ghcr.io so any node can pull it.
    v26.10.10: nginx front (entrance and shared entrance): the Model Console
    stays the app's face for the Router lifecycle, while /v1/realtime is
    proxied straight to the orchestrator — llm-init's HTTP-only proxy refuses
    WebSocket upgrades.
    v26.10.9: Public entrance now points at the Model Console (llm-init, :8090)
    like the other model applications, so the Router's model lifecycle
    (status/spec via --app) works; /v1/* including the realtime WebSocket is
    reverse-proxied to the orchestrator.
    v26.10.8: MODEL_NAME env so the Router attaches the model lifecycle to the
    app (spec show/status via --app), like the other model applications.
    v26.10.7: Model Console (llm-init) sidecar + shared entrance so the Olares
    Router discovers the service as an audio-s2s model (supports_audio_s2s)
    and fills default-audio-s2s, analogous to default-chat. Adds /v1/models.
    v26.10.6: Stable voice-LLM configuration on the Qwen3.8 vLLM stack —
    thinking on with greedy sampling, a generous token budget and a unique
    prefix nonce per call (fixes repetition loops with tool calls).
    v26.10.5: Image rebuilt so the version the service reports matches the chart.
    v26.10.4: Icon and manifest URLs moved to the Gitea raw endpoint (single
    source of truth; the GitHub mirror does not carry this repository).
    v26.10.3: Deterministic tool decisions (greedy chat sampling, cleaned tool
    schema, repair for text-encoded tool calls) and a stricter voice prompt.
    v26.10.2: Full provider implementation — streaming VAD, live transcription via
    AIM Qwen3 ASR, thinking-free chat with generate_chat_completion handoff and
    sentence-streamed OmniVoice speech, barge-in included.
    v26.10.1: Initial Release for AImighty. Speaks the OpenAI Realtime WebSocket
    protocol for Open WebUI 0.12 Realtime calls and orchestrates the installed
    AIM Qwen3 1.7B ASR, AIM Qwen3.8 27B and AIM OmniVoice 0.6B TTS apps.
    CPU only — no GPU, no additional VRAM. Built for Olares 1.12.7.
  fullDescription: |
    **AIM Realtime Voice** gives Open WebUI 0.12 its Realtime call mode without a
    new speech model: it exposes the OpenAI Realtime WebSocket endpoint that Open
    WebUI's bridge talks to and drives the AIM speech and chat apps you already
    have through their OpenAI-compatible APIs.

    **Model**
    None of its own. It calls the Router of this Olares — the platform's AI
    gateway — and asks for its default categories: `default-stt` for speech
    recognition, `default-chat` for the conversation, `default-tts` for the
    voice. The Router resolves those to whatever models this machine has, so
    the app works on any Olares with an ASR, chat and TTS model installed and
    needs no credential: the platform stamps the caller at its edge. Point it
    at fixed services instead by setting the UPSTREAM_* URLs yourself.

    **Inference Engine**
    A small Python service (FastAPI, Silero VAD on CPU) that speaks the realtime
    event set Open WebUI's voice bridge uses: session handshake, server-side VAD,
    live transcription events, response lifecycle, barge-in, and the
    `generate_chat_completion` function call Open WebUI uses to hand substantive
    questions to the chat's selected model. No GPU.

    **Key Features**
    - Open WebUI 0.12 Realtime call mode: Admin > Settings > Audio > Voice calls
    - Reuses the ASR / chat / TTS models already installed here; additional VRAM: zero
    - Finds this machine's Router and base domain automatically — install it,
      type nothing, it connects
    - Function-call handoff to the chat model, with tool approvals staying in chat
    - Configurable upstream URLs, voice and concurrency; optional bearer protection

    **API**
    ```bash
    # Open WebUI base URL (Admin > Audio > Voice calls): this app's own route
    https://<app-route>/v1
    # Health — shows the Router it resolved for this machine
    curl https://<app-route>/healthz
    ```

    **Resource Usage**
    CPU: 0.25-2 cores, RAM: 0.5-2 GiB, Disk: ~300 MB image. No GPU.

  developer: Aimighty
  website: https://github.com/bayerhazard/aimrealtime
  sourceCode: https://github.com/bayerhazard/aimrealtime
  submitter: Aimighty
  locale:
    - en-US
  supportArch:
    - amd64
  requiredCpu: "250m"
  limitedCpu: "2"
  requiredMemory: 512Mi
  limitedMemory: 2Gi
  requiredDisk: 100Mi
  limitedDisk: 2Gi

permission:
  appCache: true
  appCommon: true

options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system

envs:
  - envName: ADVERTISED_MODEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "aimrealtime"
    description: "Model id this endpoint advertises (Open WebUI sends it as ?model=)."
  - envName: MODEL_NAME
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "aimrealtime"
    description: "Model id the app serves. The Olares Router reads MODEL_NAME from the app envs to attach the model lifecycle to the application."
  - envName: MODEL_MODE
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "audio"
    description: "Model Console card mode. Must stay 'audio' for the Router's audio-s2s category."
  - envName: MODEL_SUPPORTS
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "supports_audio_s2s"
    description: "Capability flags the Router reconciles into default categories; supports_audio_s2s fills default-audio-s2s."
  - envName: MODEL_SOURCE
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "hf://Qwen/Qwen3-0.6B --include config.json"
    description: "Placeholder download the Model Console requires (config only, a few KB); the service has no weights of its own."
  - envName: API_KEY
    required: false
    type: password
    editable: true
    applyOnChange: true
    default: ""
    description: "Optional bearer token (Admin > Audio > Voice calls > API key). Empty means no bearer check: the Olares edge already gates the entrance."
  - envName: UPSTREAM_STT_URL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ""
    description: "Optional fixed transcription endpoint. Leave empty to use this Olares' Router (default-stt)."
  - envName: UPSTREAM_LLM_URL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ""
    description: "Optional fixed chat endpoint. Leave empty to use this Olares' Router (default-chat)."
  - envName: UPSTREAM_TTS_URL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ""
    description: "Optional fixed speech endpoint. Leave empty to use this Olares' Router (default-tts)."
  - envName: STT_MODEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "default-stt"
    description: "Router category or model id for transcription."
  - envName: LLM_MODEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "default-chat"
    description: "Router category or model id for the conversation."
  - envName: TTS_MODEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "default-tts"
    description: "Router category or model id for speech."
  - envName: ROUTER_BASE_URL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ""
    description: "Override for the Router base URL (…/v1). Only for exotic setups; discovery works out of the box."
  - envName: OLARES_GATEWAY_HOST
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "app-gateway-data.os-gateway.svc"
    description: "Cluster address of the Olares edge used to reach the Router in-cluster."
  - envName: DEFAULT_VOICE
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "female"
    description: "Voice preset used when Open WebUI's voice name is unknown."
  - envName: VAD_THRESHOLD
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "0.5"
  - envName: MAX_CALLS
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "2"
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN

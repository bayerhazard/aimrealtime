---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimrealtime
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimrealtime
spec:
  replicas: {{ .Values.workloads.aimrealtime.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: aimrealtime
  strategy:
    type: {{ .Values.strategy.type }}
  template:
    metadata:
      labels:
        app: aimrealtime
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      volumes:
        # Self-contained: the Model Console only fetches a placeholder config,
        # so an ephemeral cache keeps this app free of userspace paths.
        - name: hf-cache
          emptyDir: {}
        - name: run-state
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: aimrealtime-nginx
        - name: mesh-in-hosts
          configMap:
            name: olares-mesh-in-shared-hosts
            optional: true
      initContainers:
        # llm-init runs as UID 1000 and must own its cache and run dir.
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - "mkdir -p /cache/hf/hub/.locks && chown -R 1000:1000 /cache/hf/hub /run/llm-init || true"
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: run-state
              mountPath: /run/llm-init
          securityContext:
            runAsUser: 0
      containers:
      - name: aimrealtime
        image: "{{ .Values.image.full }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
          - name: ADVERTISED_MODEL
            value: {{ .Values.olaresEnv.ADVERTISED_MODEL | default "aimrealtime" | quote }}
          - name: API_KEY
            value: {{ .Values.olaresEnv.API_KEY | default "" | quote }}
          - name: UPSTREAM_STT_URL
            value: {{ .Values.olaresEnv.UPSTREAM_STT_URL | default "" | quote }}
          - name: UPSTREAM_TTS_URL
            value: {{ .Values.olaresEnv.UPSTREAM_TTS_URL | default "" | quote }}
          - name: UPSTREAM_LLM_URL
            value: {{ .Values.olaresEnv.UPSTREAM_LLM_URL | default "" | quote }}
          - name: STT_MODEL
            value: {{ .Values.olaresEnv.STT_MODEL | default "default-stt" | quote }}
          - name: TTS_MODEL
            value: {{ .Values.olaresEnv.TTS_MODEL | default "default-tts" | quote }}
          - name: LLM_MODEL
            value: {{ .Values.olaresEnv.LLM_MODEL | default "default-chat" | quote }}
          - name: OLARES_GATEWAY_HOST
            value: {{ .Values.olaresEnv.OLARES_GATEWAY_HOST | default "app-gateway-data.os-gateway.svc" | quote }}
          - name: ROUTER_BASE_URL
            value: {{ .Values.olaresEnv.ROUTER_BASE_URL | default "" | quote }}
          - name: DEFAULT_VOICE
            value: {{ .Values.olaresEnv.DEFAULT_VOICE | default "female" | quote }}
          - name: VAD_THRESHOLD
            value: {{ .Values.olaresEnv.VAD_THRESHOLD | default "0.5" | quote }}
          - name: MAX_CALLS
            value: {{ .Values.olaresEnv.MAX_CALLS | default "2" | quote }}
          - name: LOG_LEVEL
            value: {{ .Values.olaresEnv.LOG_LEVEL | default "info" | quote }}
        volumeMounts:
          # Platform-managed list of this Olares' route hosts; the router base
          # domain is read from it. The ConfigMap appears shortly after install,
          # hence optional.
          - name: mesh-in-hosts
            mountPath: /var/run/olares/mesh-in-shared-hosts
            readOnly: true
        ports:
          - containerPort: {{ .Values.port }}
            name: http
        resources:
            {{- toYaml .Values.resources | nindent 10 }}
        startupProbe:
            {{- toYaml .Values.startupProbe | nindent 10 }}
        livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 10 }}
      # Model Console (llm-init): serves the card the Olares Router reads to
      # fill default-audio-s2s (MODEL_SUPPORTS=supports_audio_s2s) and proxies
      # /v1/* to this pod's service on 8080. It waits for the advertised model
      # id on /v1/models before declaring the model ready.
      - name: llm-init
        image: "{{ .Values.llmInit.image }}"
        imagePullPolicy: IfNotPresent
        env:
          - name: ENGINE_KIND
            value: "audio"
          - name: LLM_INIT_TEST_ENGINE_URL
            value: "http://127.0.0.1:{{ .Values.port }}"
          - name: MODEL_NAME
            value: {{ .Values.olaresEnv.MODEL_NAME | default (.Values.olaresEnv.ADVERTISED_MODEL | default "aimrealtime") | quote }}
          - name: MODEL_MODE
            value: {{ .Values.olaresEnv.MODEL_MODE | default "audio" | quote }}
          - name: MODEL_SUPPORTS
            value: {{ .Values.olaresEnv.MODEL_SUPPORTS | default "supports_audio_s2s" | quote }}
          - name: MODEL_SOURCE
            value: {{ .Values.olaresEnv.MODEL_SOURCE | default "hf://Qwen/Qwen3-0.6B --include config.json" | quote }}
          {{- if .Values.olaresEnv.HF_ENDPOINT }}
          - name: HF_ENDPOINT
            value: "{{ .Values.olaresEnv.HF_ENDPOINT }}"
          {{- end }}
          {{- if .Values.olaresEnv.HF_TOKEN }}
          - name: HF_TOKEN
            value: "{{ .Values.olaresEnv.HF_TOKEN }}"
          {{- end }}
          - name: MAX_CONCURRENT_DOWNLOADS
            value: "1"
          - name: RUN_DIR
            value: /run/llm-init
          - name: PORT
            value: "{{ .Values.llmInit.port }}"
          - name: LOG_LEVEL
            value: "{{ .Values.olaresEnv.LOG_LEVEL | default "info" }}"
          - name: LOG_FORMAT
            value: json
        ports:
          - containerPort: {{ .Values.llmInit.port }}
            name: model-console
        readinessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.llmInit.port }}
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.llmInit.port }}
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
            {{- toYaml .Values.llmInit.resources | nindent 10 }}
        volumeMounts:
          - name: hf-cache
            mountPath: /cache/hf/hub
          - name: run-state
            mountPath: /run/llm-init

      # nginx front: the public entrance serves the Model Console for the
      # Router's model lifecycle AND passes the realtime WebSocket straight to
      # the orchestrator, which llm-init's HTTP-only proxy refuses (403).
      - name: nginx
        image: "{{ .Values.nginx.image }}"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: {{ .Values.nginx.port }}
            name: http
        readinessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.nginx.port }}
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
            {{- toYaml .Values.nginx.resources | nindent 10 }}
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimrealtime-nginx
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
        listen {{ .Values.nginx.port }};
        server_name _;
        client_max_body_size 64m;

        # Realtime WebSocket straight to the orchestrator.
        location /v1/realtime {
            proxy_pass http://127.0.0.1:{{ .Values.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Everything else: the Model Console (card, progress, health, UI) and
        # its /v1/* reverse proxy to the orchestrator.
        location / {
            proxy_pass http://127.0.0.1:{{ .Values.llmInit.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: aimrealtime
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimrealtime
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
  selector:
    app: aimrealtime
